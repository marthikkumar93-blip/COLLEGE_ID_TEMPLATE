<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card-container">
        <div class="id-card">
            <header class="card-header">
                <img class="clg-logo" src="clg_logo.png" alt="College Logo">
                <p class="college-title">osmania</p>
            </header>

            <div class="photo-wrap">
                <img class="photo" src="idimg.jpg" alt="Profile Photo">
            </div>

            <main class="card-body">
                <h2 class="student-name">jackie</h2>
                <p class="college-name">osmaina </p>

                <hr class="divider">

                <div class="details">
                    <p class="course">BCA</p>
                    <p class="dob">18-04-2005</p>
                </div>

                <div class="id-line">
                    <span class="id-label">ID-NO:</span>
                    <span class="id-value">ID-VALUE</span>
                </div>

                <div class="barcode">
                    <span></span><span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span><span></span>
                    <span></span><span></span>
                </div>
            </main>

            <footer class="card-footer">
                <p class="footer-text">Issued by : college</p>
            </footer>
        </div>
    </div>
</body>

</html>
